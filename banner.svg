<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="استاروکس STARVEX؛ سرویس فیلترشکن قوی استارلینک و نت ملی" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
:root{--b1:#f7f9fd;--b2:#dfe8f6;--ink:#0a1428;--mute:#56647d;--acc:#1b55f5;--acc2:#0a8fa3;--line:#b9c6dc;--star:#1b55f5}
@media (prefers-color-scheme:dark){:root{--b1:#060b18;--b2:#0e1c3d;--ink:#eaf1ff;--mute:#9aaac8;--acc:#5ce1e6;--acc2:#8aa8ff;--line:#22365f;--star:#fff}}
text{font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif}
.ring{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 8}
.tw{animation:b 3.4s ease-in-out infinite}@keyframes b{50%{opacity:.15}}
.beam{stroke:var(--acc);stroke-width:2;stroke-dasharray:5 6;animation:d 1.5s linear infinite}@keyframes d{to{stroke-dashoffset:-22}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--b1)"/><stop offset="1" stop-color="var(--b2)"/></linearGradient>
<radialGradient id="earth" cx="35%" cy="30%"><stop offset="0" stop-color="var(--acc2)"/><stop offset="1" stop-color="var(--b2)"/></radialGradient>
</defs>
<rect x="1" y="1" width="1198" height="398" rx="26" fill="url(#bg)" stroke="var(--line)"/>
<g fill="var(--star)">
<circle class="tw" cx="70" cy="60" r="2.2"/><circle class="tw" cx="540" cy="48" r="1.8" style="animation-delay:.7s"/>
<circle class="tw" cx="130" cy="340" r="2" style="animation-delay:1.4s"/><circle class="tw" cx="1130" cy="70" r="2.2" style="animation-delay:2s"/>
<circle class="tw" cx="1100" cy="340" r="1.8" style="animation-delay:1s"/><circle class="tw" cx="520" cy="360" r="2" style="animation-delay:2.6s"/>
</g>
<g transform="translate(290 200)">
<circle class="ring" r="165"/>
<g transform="rotate(-24)"><ellipse class="ring" rx="190" ry="70"/></g>
<circle r="86" fill="url(#earth)" stroke="var(--line)"/>
<path d="M-48-20q22-20 42-6t12 30-34 12-20-36zM28 30q24-6 38 12t-10 32-32-8z" fill="var(--acc)" opacity=".3"/>
<g transform="rotate(-24)">
<g><rect x="-15" y="-3.5" width="11" height="7" fill="var(--acc)"/><rect x="4" y="-3.5" width="11" height="7" fill="var(--acc)"/><rect x="-4" y="-6" width="8" height="12" rx="2" fill="var(--ink)"/>
<animateMotion dur="26s" repeatCount="indefinite" path="M-190 0 a190 70 0 1 0 380 0 a190 70 0 1 0 -380 0"/></g>
</g>
<g><circle r="5" fill="var(--acc2)"/><circle r="11" fill="none" stroke="var(--acc2)" opacity=".4"/>
<animateMotion dur="18s" repeatCount="indefinite" path="M-165 0 a165 165 0 1 1 330 0 a165 165 0 1 1 -330 0"/></g>
</g>
<g transform="translate(760 0)" text-anchor="middle">
<text y="172" font-size="98" font-weight="800" letter-spacing="12" fill="var(--ink)">STARVEX</text>
<text y="236" font-size="44" font-weight="800" fill="var(--acc)">استاروکس</text>
<text y="286" font-size="25" fill="var(--mute)">سرویس فیلترشکن قوی استارلینک و نت ملی</text>
<rect x="-250" y="312" width="500" height="44" rx="22" fill="none" stroke="var(--line)"/>
<text y="342" font-size="18" fill="var(--ink)">نت ملی مخصوص جنگ  |  استارلینک  |  ۲ کاربره</text>
</g>
</svg>
